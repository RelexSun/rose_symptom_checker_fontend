version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: red-rose-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SECRET_KEY=${SECRET_KEY}
    env_file:
      - .env.local
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

